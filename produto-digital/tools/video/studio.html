<!doctype html>

<style>

  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--creme); }
  body { font-family: Inter, 'DejaVu Sans', sans-serif; color: var(--tinta); }
  #stage { position: absolute; inset: 0; }
  .L { position: absolute; transform-origin: 0 0; will-change: transform, opacity; }
  .hook { left: 70px; width: 940px; top: 250px; font-size: 76px; line-height: 1.08; font-weight: 800; letter-spacing: -.02em; }
  .hook em { font-style: normal; color: var(--rosa); }
  .txt { left: 70px; width: 940px; font-size: 58px; line-height: 1.12; font-weight: 750; letter-spacing: -.015em; }
  .sub { left: 70px; width: 940px; font-size: 40px; line-height: 1.25; font-weight: 500; color: var(--cinza); }
  .nota { left: 70px; width: 940px; top: 1640px; font-size: 30px; color: var(--cinza); font-weight: 500; }
  .card { background: #fff; border-radius: 28px; box-shadow: 0 18px 50px rgba(43,36,32,.14), 0 0 0 1px rgba(43,36,32,.06); }
  .caderno { left: 90px; width: 900px; top: 560px; padding: 56px 60px; font-size: 54px; line-height: 1.45;
    background: repeating-linear-gradient(#fff 0 78px, #E9DCD2 78px 80px); }
  .caderno b { font-weight: 800; }
  .chip { left: 90px; padding: 26px 34px; font-size: 46px; font-weight: 700; border-radius: 22px; background: var(--rosa-claro); }
  .sheet { overflow: hidden; background: #fff; }
  .sheet img { display: block; }
  .hl { position: absolute; border: 7px solid var(--rosa); border-radius: 14px; background: rgba(226,87,76,.07); }
  .big { left: 70px; width: 940px; font-size: 96px; line-height: 1.02; font-weight: 850; letter-spacing: -.03em; }
  .big .ok { color: var(--verde-escuro); }
  .cta { left: 90px; width: 900px; top: 900px; padding: 60px; text-align: left; }
  .cta .marca { font-size: 84px; font-weight: 850; letter-spacing: -.03em; }
  .cta .marca span { color: var(--rosa); }
  .cta p { font-size: 44px; line-height: 1.3; margin-top: 18px; font-weight: 550; }
  .cta .preco { display: inline-block; margin-top: 34px; padding: 22px 36px; border-radius: 999px; background: var(--tinta); color: var(--creme); font-size: 44px; font-weight: 750; }
  .bolha { max-width: 820px; padding: 30px 38px; border-radius: 34px; font-size: 48px; line-height: 1.3; font-weight: 500; }
  .entra { left: 70px; background: #fff; border-bottom-left-radius: 8px; box-shadow: 0 6px 20px rgba(43,36,32,.08); }
  .sai { right: 70px; background: #E5F6DF; border-bottom-right-radius: 8px; }
  .sai s { color: var(--cinza); }
  .hora { display: block; text-align: right; font-size: 28px; color: var(--cinza); margin-top: 8px; }
  .chat-bg { left: 0; top: 0; width: 1080px; height: 1920px; background: #EFE7DE; }
  .timer { right: 70px; top: 120px; padding: 18px 30px; border-radius: 999px; background: var(--tinta); color: var(--creme); font-size: 52px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .passo { left: 70px; top: 230px; width: 940px; font-size: 64px; line-height: 1.08; font-weight: 800; }
  .passo small { display: block; font-size: 38px; font-weight: 550; color: var(--cinza); margin-top: 14px; letter-spacing: 0; }
</style>

    { parent: 'tb', html: '<div class="hl" style="left:790px;top:158px;width:270px;height:42px"></div>', keys: [[11.4, { o: 0 }], [11.7, { o: 1 }]] },
    { html: '<div class="L bolha entra" style="top:420px">Oi! Quanto fica 100 brigadeiros pra sábado?<span class="hora">09:41</span></div>', keys: [[13.6, { o: 0 }], [13.9, { o: 1 }]] },
    { html: '<div class="L bolha sai" style="top:680px">100 brigadeiros: R$ 200,00 🙂<br>Posso reservar o seu sábado?<span class="hora">09:42</span></div>', keys: [[14.2, { o: 0, y: 30 }], [14.6, { o: 1, y: 0 }], [16.6, { o: 1 }], [17, { o: 0 }]] },
    { html: '<div class="L txt" style="top:1060px">Preço com a sua hora, o gás e a taxa já dentro.</div>', keys: [[15, { o: 0 }], [15.4, { o: 1 }], [16.6, { o: 1 }], [17, { o: 0 }]] },
    { html: '<div class="L card cta"><div class="marca">Conta <span>Doce</span></div><p>planilha de precificação pra confeitaria: custo real, preço sugerido e tabela pronta</p><div class="preco">R$ 27 · link na página</div></div>', keys: [[17, { o: 0, y: 40 }], [17.4, { o: 1, y: 0 }]] },

  conceito_05: { dur: 26, layers: [

    { id: 'tm', type: 'timer', html: '<div class="L timer">15:00</div>', keys: [[0, { o: 0, v: 900 }], [.6, { o: 1, v: 900 }], [3.4, { o: 1, v: 900 }], [9, { o: 1, v: 600 }], [15, { o: 1, v: 300 }], [21, { o: 1, v: 0 }], [23, { o: 1, v: 0 }], [23.4, { o: 0, v: 0 }]] },
    { html: '<div class="L sub" style="top:228px;left:auto;right:70px;width:auto;font-size:28px">tempo acelerado no vídeo</div>', keys: [[3.4, { o: 0 }], [3.8, { o: 1 }], [21, { o: 1 }], [21.4, { o: 0 }]] },
    { html: '<div class="L passo" style="top:300px">1. Custos do mês<small>quanto você quer ganhar, horas e gastos fixos</small></div>', keys: [[3.4, { o: 0 }], [3.8, { o: 1 }], [8.6, { o: 1 }], [9, { o: 0 }]] },

    { html: '<div class="L sub" style="top:1500px">a planilha calcula o valor da sua hora</div>', keys: [[6.4, { o: 0 }], [6.8, { o: 1 }], [8.6, { o: 1 }], [9, { o: 0 }]] },
    { html: '<div class="L passo" style="top:300px">2. Insumos<small>só o preço do que você usa; 52 itens já listados</small></div>', keys: [[9, { o: 0 }], [9.4, { o: 1 }], [14.6, { o: 1 }], [15, { o: 0 }]] },

const params = new URLSearchParams(location.search), video = V[params.get('v') || 'pov_01']
const stage = document.getElementById('stage'), els = {}
for (const [i, l] of video.layers.entries()) {
  const t = document.createElement('template'); t.innerHTML = l.html.trim()
  const el = t.content.firstElementChild
  ;(l.parent ? els[l.parent] : stage).appendChild(el)
  l.el = el; if (l.id) els[l.id] = el
}
const ease = (k) => (k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2)
function at(keys, t) {
  if (t <= keys[0][0]) return keys[0][1]
  for (let i = 1; i < keys.length; i++) {
    const [t1, b] = keys[i], [t0, a] = keys[i - 1]
    if (t <= t1) {
      const k = ease((t - t0) / (t1 - t0)), o = {}
      for (const p of new Set([...Object.keys(a), ...Object.keys(b)])) o[p] = (a[p] ?? b[p]) + ((b[p] ?? a[p]) - (a[p] ?? b[p])) * k
      return o
    }
  }
  return keys[keys.length - 1][1]
}
window.__dur = video.dur
window.__tick = (t) => {
  for (const l of video.layers) {
    const p = at(l.keys, t)
    l.el.style.opacity = p.o ?? 1
    l.el.style.transform = `translate(${p.x || 0}px, ${p.y || 0}px) scale(${p.s ?? 1})`
    if (l.type === 'timer') { const v = Math.max(0, Math.round(p.v)); l.el.textContent = `${String(Math.floor(v / 60)).padStart(2, '0')}:${String(v % 60).padStart(2, '0')}` }
  }
}
window.__tick(0)
